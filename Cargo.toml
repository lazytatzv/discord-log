[package]
name = "discord-log"
version = "0.1.9"
edition = "2024"
description = "Send command execution outputs to a Discord Webhook cleanly and reliably."
license = "MIT OR Apache-2.0"
repository = "https://github.com/lazytatzv/discord-log"
readme = "README.md"

[[bin]]
name = "discord-log"
path = "src/main.rs"

[[bin]]
name = "log"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["multipart"] }
anyhow = "1.0"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
